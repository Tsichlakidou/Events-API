name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: docker build -t events-api .

      - name: Start container
        run: docker run -d -p 5000:5000 --name events-api-container events-api

      - name: Health check
        run: |
          sleep 5
          curl --fail http://localhost:5000/api/health

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install requirements
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run tests
        run: pytest -v

      - name: Clean up container
        if: always()
        run: |
          docker stop events-api-container || true
          docker rm events-api-container || true

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            tsichlakidou/events-api:latest
            tsichlakidou/events-api:${{ github.sha }}

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

      - name: Smoke test deployed API
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          echo "Waiting for Render deployment..."

          for i in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 20 \
              "$RENDER_BASE_URL/api/health"; then
              echo "Health check successful!"
              exit 0
            fi

            echo "Attempt $i failed. Retrying in 15 seconds..."
            sleep 15
          done

          echo "Smoke test failed!"
          exit 1