name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: docker build -t events-api .

      - name: Start container
        run: docker run -d -p 5000:5000 --name events-api-container events-api

      - name: Health check
        run: |
          sleep 5
          curl --fail http://localhost:5000/api/health

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install requirements
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run tests
        run: |
          pytest -v
          exit 1

      - name: Clean up container
        if: always()
        run: |
          docker stop events-api-container || true
          docker rm events-api-container || true
